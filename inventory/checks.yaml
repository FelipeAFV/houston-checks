# Uptime/Rundeck check catalog: defaults and checks only.
# Groups and NetBox: inventory/inventory.yaml (Ansible format).
#
# Each check: path = script relative to SCM_BASE_DIR (resolved at runtime).
# Stable id for tags/jobs/Uptime = basename without extension (stem).

defaults:
  grace: 3600
  tz: UTC
  check_script_base: /tmp/rundeck
  scm_base_dir: /home/rundeck/server/data/provision
  rundeck:
    job_timeout: 20m
    ssh_connect_timeout_ms: 60000
    ssh_command_timeout_ms: 300000
    node_threadcount: 10
    workflow_strategy: node-first
    sequence_keepgoing: false
  python_bastion:
    username: houston
    hostname: python_bastion
    port: 22
    ssh_key_storage_path: keys/project/houston/python-bastion/houston.key

checks:
  - path: check-shell/apt_unattended_upgrades_disabled.sh
    schedule: "30 11 * * *"
    groups: [storage-server, provisioning-server]

  - path: check-shell/ufw.sh
    schedule: "*/15 * * * *"
    grace: 900
    groups: [web_servers]
