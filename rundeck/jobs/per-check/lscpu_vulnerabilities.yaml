- defaultTab: nodes
  description: 'CPU microcode vulnerability mitigations must not report Vulnerable.'
  executionEnabled: true
  group: houston
  loglevel: INFO
  name: houston - lscpu_vulnerabilities
  nodeFilterEditable: false
  scheduleEnabled: true
  schedule:
    time:
      hour: '7'
      minute: '0'
      seconds: '0'
    weekday:
      day: '*'
    month: '*'
    year: '*'
  timeout: 20m
  nodefilters:
    dispatch:
      excludePrecedence: true
      keepgoing: true
      rankOrder: ascending
      successOnEmptyNodeFilter: false
      threadcount: '10'
    filter: 'tags: check-lscpu_vulnerabilities'
  sequence:
    strategy: node-first
    keepgoing: false
    commands:
      - script: |
          NODE_BASE='/var/tmp/rundeck'
          mkdir -p "${NODE_BASE}/scripts/lib" "${NODE_BASE}/check-python"
        scriptInterpreter: /bin/bash
        description: 'Create check paths on the node (Copy File/SCP does not mkdir -p).'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_lscpu_vulnerabilities}"
      - nodeStep: true
        type: copyfile
        description: 'Copy run-check-step.sh to the node.'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/rundeck/provisioning/scripts/run-check-step.sh
          destinationPath: '/var/tmp/rundeck/scripts/'
          recursive: 'false'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_lscpu_vulnerabilities}"
      - nodeStep: true
        type: copyfile
        description: 'Copy lib/check-capture.sh to the node.'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/rundeck/provisioning/scripts/lib/check-capture.sh
          destinationPath: '/var/tmp/rundeck/scripts/lib/'
          recursive: 'false'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_lscpu_vulnerabilities}"
      - nodeStep: true
        type: copyfile
        description: 'Copy check-python/ tree (dest must be parent dir to avoid check-python/check-python nesting).'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/check-python
          destinationPath: '/var/tmp/rundeck/'
          recursive: 'true'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_lscpu_vulnerabilities}"
      - script: |
          NODE_BASE='/var/tmp/rundeck'
          chmod +x "${NODE_BASE}/scripts/run-check-step.sh" 2>/dev/null || true
          export NODE_NAME='@node.name@'
          export JOB_EXECID='@job.execid@'
          set +e
          bash "${NODE_BASE}/scripts/run-check-step.sh" python lscpu_vulnerabilities "${NODE_BASE}/check-python"
          CHECK_RC=$?
          set -e
          printf 'CHECK_RC=%s\n' "${CHECK_RC}"
          printf 'RUNDECK:DATA:check_rc=%s\n' "${CHECK_RC}"
          exit 0
        scriptInterpreter: /bin/bash
        description: 'Remote exec: run check-python/lscpu_vulnerabilities.py locally on the node. Always exits 0 so the curl step receives log-filter data.'
        plugins:
          LogFilter:
            - type: key-value-data
              config:
                regex: ^RUNDECK:DATA:(.+?)\s*=\s*(.+)$
                logData: 'false'
            - type: key-value-data
              config:
                name: check_output_b64
                regex: ^CHECK_BODY_B64=(.+)$
            - type: key-value-data
              config:
                name: check_rc
                regex: ^CHECK_RC=(.+)$
      - nodeStep: true
        type: localexec
        configuration:
          command: >
            /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh from-data
            "${data.check_rc}"
            "${data.check_output_b64}"
            "${node.uptime_ping_lscpu_vulnerabilities}"
        description: 'Localexec on Rundeck: curl Uptime ping URL; exits with CHECK_RC so Rundeck marks fail when the check failed.'
