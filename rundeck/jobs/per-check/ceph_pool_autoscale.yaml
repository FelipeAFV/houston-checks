- defaultTab: nodes
  description: 'All Ceph pools must have pg_autoscale_mode on.'
  executionEnabled: true
  group: houston
  loglevel: INFO
  name: houston - ceph_pool_autoscale
  nodeFilterEditable: false
  scheduleEnabled: true
  schedule:
    time:
      hour: '*/6'
      minute: '10'
      seconds: '0'
    weekday:
      day: '*'
    month: '*'
    year: '*'
  timeout: 20m
  
  nodefilters:
    dispatch:
      excludePrecedence: true
      keepgoing: true
      rankOrder: ascending
      successOnEmptyNodeFilter: false
      threadcount: '10'
    filter: 'tags: check-ceph_pool_autoscale'
  sequence:
    strategy: node-first
    keepgoing: false
    commands:
      - script: |
          NODE_BASE='/var/tmp/rundeck'
          mkdir -p "${NODE_BASE}/scripts/lib" "${NODE_BASE}/lib"
        scriptInterpreter: /bin/bash
        description: 'Create check paths on the node (Copy File/SCP does not mkdir -p).'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_ceph_pool_autoscale}"
      - nodeStep: true
        type: copyfile
        description: 'Copy run-check-step.sh to the node.'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/rundeck/provisioning/scripts/run-check-step.sh
          destinationPath: '/var/tmp/rundeck/scripts/'
          recursive: 'false'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_ceph_pool_autoscale}"
      - nodeStep: true
        type: copyfile
        description: 'Copy lib/check-capture.sh to the node.'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/rundeck/provisioning/scripts/lib/check-capture.sh
          destinationPath: '/var/tmp/rundeck/scripts/lib/'
          recursive: 'false'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_ceph_pool_autoscale}"
      - nodeStep: true
        type: copyfile
        description: 'Copy check-shell/ceph_pool_autoscale.sh to the node.'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/check-shell/ceph_pool_autoscale.sh
          destinationPath: '/var/tmp/rundeck/ceph_pool_autoscale.sh'
          recursive: 'false'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_ceph_pool_autoscale}"
      - nodeStep: true
        type: copyfile
        description: 'Copy check-shell/lib/ contents into lib/ on the node (recursive copies folder contents, not the folder name).'
        configuration:
          sourcePath: /home/rundeck/server/data/provision/check-shell/lib/
          destinationPath: '/var/tmp/rundeck/lib/'
          recursive: 'true'
          echo: 'true'
        errorhandler:
          nodeStep: true
          type: localexec
          configuration:
            command: >
              /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh fail "${node.uptime_ping_ceph_pool_autoscale}"
      - script: |
          NODE_BASE='/var/tmp/rundeck'
          chmod +x "${NODE_BASE}/scripts/run-check-step.sh" 2>/dev/null || true
          chmod +x "${NODE_BASE}/ceph_pool_autoscale.sh" 2>/dev/null || true
          find "${NODE_BASE}/lib" -type f -name '*.sh' -exec chmod a+x {} + 2>/dev/null || true
          export NODE_NAME='@node.name@'
          export NODE_TAGS='@node.tags@'
          export JOB_EXECID='@job.execid@'
          export OPENSTACK_ADMIN_RC=''
          export TARGET_HOST='@node.target_host@'
          export TARGET_USER='@node.target_user@'
          export TARGET_PORT='@node.target_port@'
          
          set +e
          if [[ -n "${TARGET_HOST}" ]]; then
            REMOTE="${TARGET_USER}@${TARGET_HOST}"
            SSH_OPTS=(-p "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
            ssh "${SSH_OPTS[@]}" "${REMOTE}" "mkdir -p ${NODE_BASE}/scripts/lib ${NODE_BASE}/lib"
            scp -P "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${NODE_BASE}/scripts/run-check-step.sh" "${REMOTE}:${NODE_BASE}/scripts/"
            scp -P "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -r \
              "${NODE_BASE}/scripts/lib" "${REMOTE}:${NODE_BASE}/scripts/"
            scp -P "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "${NODE_BASE}/ceph_pool_autoscale.sh" "${REMOTE}:${NODE_BASE}/"
            scp -P "${TARGET_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -r \
              "${NODE_BASE}/lib" "${REMOTE}:${NODE_BASE}/"
            ssh "${SSH_OPTS[@]}" "${REMOTE}" \
              "chmod +x ${NODE_BASE}/scripts/run-check-step.sh ${NODE_BASE}/ceph_pool_autoscale.sh 2>/dev/null || true; \
               find ${NODE_BASE}/lib -type f -name '*.sh' -exec chmod a+x {} + 2>/dev/null || true; \
               export NODE_NAME='${NODE_NAME}'; export NODE_TAGS='${NODE_TAGS}'; export JOB_EXECID='${JOB_EXECID}'; \
               export OPENSTACK_ADMIN_RC='${OPENSTACK_ADMIN_RC}'; \
               bash ${NODE_BASE}/scripts/run-check-step.sh shell ceph_pool_autoscale ${NODE_BASE}"
            CHECK_RC=$?
          else
            bash "${NODE_BASE}/scripts/run-check-step.sh" shell ceph_pool_autoscale "${NODE_BASE}"
            CHECK_RC=$?
          fi
          set -e
          printf 'CHECK_RC=%s\n' "${CHECK_RC}"
          printf 'RUNDECK:DATA:check_rc=%s\n' "${CHECK_RC}"
          exit 0
        scriptInterpreter: /bin/bash
        description: 'Remote exec: run check-shell/ceph_pool_autoscale.sh on target (SSH hop via bastion when target_host is set). Always exits 0 so the curl step receives log-filter data.'
        plugins:
          LogFilter:
            - type: key-value-data
              config:
                regex: ^RUNDECK:DATA:(.+?)\s*=\s*(.+)$
                logData: 'false'
            - type: key-value-data
              config:
                name: check_output_b64
                regex: ^CHECK_BODY_B64=(.+)$
            - type: key-value-data
              config:
                name: check_rc
                regex: ^CHECK_RC=(.+)$
      - nodeStep: true
        type: localexec
        configuration:
          command: >
            /home/rundeck/server/data/provision/rundeck/provisioning/scripts/curl-step.sh from-data
            "${data.check_rc}"
            "${data.check_output_b64}"
            "${node.uptime_ping_ceph_pool_autoscale}"
        description: 'Localexec on Rundeck: curl Uptime ping URL; exits with CHECK_RC so Rundeck marks fail when the check failed.'
