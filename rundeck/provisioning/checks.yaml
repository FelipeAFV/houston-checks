# Uptime/Rundeck check catalog: checks only.
# Operational defaults: rundeck/provisioning/config.yaml.
# Groups and NetBox: rundeck/provisioning/inventory.yaml (Ansible format).
#
# Each check: path = script relative to SCM_BASE_DIR (resolved at runtime).
# Stable id for tags/jobs/Uptime = basename without extension (stem).
# schedule: 5-field cron — drives Uptime heartbeats and Rundeck per-check job cron.
# Optional one_host: true — assign check tag to a single eligible host (cluster CLI checks).
# Optional id: — stable check id when path stem differs or same script is registered twice.
# Optional admin_rc_path: — admin-openrc.sh path exported as OPENSTACK_ADMIN_RC for OpenStack CLI checks.

checks:
  - path: check-shell/apt_unattended_upgrades_disabled.sh
    schedule: "30 11 * * *"
    groups:
      storage-server: {}
      provisioning-server: {}
      hybrid-provisioning-server: {}

  - path: check-shell/ufw.sh
    schedule: "*/15 * * * *"
    grace: 900
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-shell/mdcheck_presence.sh
    schedule: "0 6 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-shell/mdcheck_deadlock_fix.sh
    schedule: "15 6 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-shell/powerprofile.sh
    schedule: "30 6 * * *"
    options:
    - name: expected_intel_profile_lower_range
      description: Expected Intel power profile lower range
      required: true
      default: "6"
    - name: expected_intel_profile_upper_range
      description: Expected Intel power profile upper range
      required: true
      default: "7"
    - name: expected_amd_profile_regex
      description: Expected AMD power profile regex
      required: true
      default: "^(PerfPerWattOptimized|PerfPerWattOptimizedDapc|PerfPerWattOptimizedOS)$"
    groups:
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}
      provisioning-server: {}
      hybrid-provisioning-server: {}

  - path: check-shell/prometheus_exporters_scrapped.sh
    schedule: "30 6 * * *"
    options:
    - name: scrape_timeout
      description: Expected timeout for checking exporter scrapping
      required: true
      default: "60"
    groups:
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-shell/active_alerts.sh
    schedule: "30 6 * * *"
    options:
    - name: whitemon_namespace
      description: Namespace to check for active alerts in Whitemon
      required: true
      default: "whitemon"
    groups:
      kubernetes-cluster: {}

  - path: check-shell/nfs_read_write.sh
    schedule: "*/15 * * * *"
    grace: 900
    options:
    - name: nfs_paths
      description: Comma-separated absolute NFS mount paths
      required: true
      default: "/data/nfs_1,/data/nfs_2"
    - name: dummy_file_size_mb
      description: Dummy file size in MiB
      required: true
      default: "1"
    - name: nfs_io_timeout_seconds
      description: Timeout in seconds for each NFS I/O operation
      required: true
      default: "120"
    groups:
      storage-server: {}

  - path: check-shell/server_needs_reboot.sh
    schedule: "30 6 * * *"
    groups:
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}
      provisioning-server: {}
      hybrid-provisioning-server: {}

  - path: check-shell/sysctl_parameters.sh
    schedule: "30 6 * * *"
    options:
    - name: sysctl_parameters
      description: List of sysctl parameters whose values are to be validated
      required: true
      default: "fs.inotify.max_user_watches,fs.inotify.max_user_instances,fs.inotify.max_queued_events"

    - name: min_sysctl_values
      description: Expected minimum values for sysctl_parameters, in order
      required: true
      default: "2099999999,2099999999,2099999999"

    - name: max_sysctl_values
      description: Expected maximum values for sysctl_parameters, in order
      required: true
      default: "2099999999,2099999999,2099999999"

    groups:
      kubernetes-worker: {}

  - path: check-shell/sysctl_parameters_nodeconfig.sh
    schedule: "30 6 * * *"
    options:
    - name: sysctl_parameters
      description: List of sysctl parameters whose values are to be validated
      required: true
      default: "fs.inotify.max_user_watches,fs.inotify.max_user_instances,fs.inotify.max_queued_events"

    - name: min_sysctl_values
      description: Expected minimum values for sysctl_parameters, in order
      required: true
      default: "2099999999,2099999999,2099999999"

    - name: max_sysctl_values
      description: Expected maximum values for sysctl_parameters, in order
      required: true
      default: "2099999999,2099999999,2099999999"

    - name: nodeconfig_name
      description: Name of the NodeConfig resource
      required: true
      default: "nodeconfig-kernel-params"

    - name: nodeconfig_namespace
      description: Namespace of the NodeConfig resource
      required: true
      default: "default"

    groups:
      kubernetes-cluster: {}

  - path: check-shell/grub_needs_reboot.sh
    schedule: "45 6 * * *"
    groups:
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}
      hybrid-provisioning-server: {}

  - path: check-shell/vrouter_ha_active_agent.sh
    schedule: "15 */6 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
    one_host: true
    admin_rc_path: #update with the path to the admin-openrc.sh file

  - path: check-shell/vrouter_port_bindings.sh
    schedule: "30 */6 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
    one_host: true
    admin_rc_path:

  - path: check-shell/host_aggregates_consistency.sh
    schedule: "45 */6 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
    one_host: true
    admin_rc_path: #update with the path to the admin-openrc.sh file

  - path: check-shell/ceph_balancer_status.sh
    schedule: "0 */6 * * *"
    groups:
      storage-server: {}
    one_host: true

  - path: check-shell/ceph_pool_autoscale.sh
    schedule: "10 */6 * * *"
    groups:
      storage-server: {}
    one_host: true

  - path: check-shell/ceph_health_status.sh
    schedule: "20 */6 * * *"
    groups:
      storage-server: {}
    one_host: true

  - path: check-shell/ceph_health_checks.sh
    schedule: "30 */6 * * *"
    groups:
      storage-server: {}
    one_host: true

  - path: check-shell/ceph_osd_status.sh
    schedule: "40 */6 * * *"
    groups:
      storage-server: {}
    one_host: true

  - path: check-shell/ocnos_vp_lag.sh
    schedule: "40 */6 * * *"
    groups:
      border-leaf-switch: {}
      server-leaf-switch: {}

  - path: check-shell/ocnos_vxlan_mac.sh
    schedule: "40 */6 * * *"
    groups:
      border-leaf-switch: {}
      server-leaf-switch: {}

  - path: check-python/sonic_show_running_config.py
    schedule: "40 */6 * * *"
    groups:
      border-leaf-switch: {}
      server-leaf-switch: {}

  - path: check-shell/tzdata_freshness.sh
    schedule: "0 8 * * *"
    options:
    - name: minimum_tzdata_version
      description: Minimum IANA tzdata version (YYYYx) or auto for the annual policy
      required: true
      default: "auto"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-shell/tzdata_freshness_k8tz.sh
    schedule: "15 8 * * *"
    options:
    - name: minimum_tzdata_version
      description: Minimum IANA tzdata version (YYYYx) or auto for the annual policy
      required: true
      default: "auto"
    - name: k8tz_init_container_name
      description: Name of the init container injected by k8tz
      required: true
      default: "k8tz"
    groups:
      kubernetes-cluster: {}

  - path: check-shell/du_folder_size.sh
    schedule: "30 8 * * *"
    options:
    - name: folder_paths
      description: Comma-separated absolute directory paths (no commas or control characters in paths)
      required: true
      default: "/home/whitestack"
    - name: folder_limit_sizes
      description: Comma-separated exclusive size limits for FOLDER_PATHS in the same order; use IEC binary size such as 1Gi, 10.7Mi, 50Ki, or integer byte values. Suffixes are case-sensitive.
      required: true
      default: "1Gi"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      tenant-server: {}
      infra-server: {}
      storage-server: {}

  - path: check-shell/password_expiration.sh
    schedule: "15 7 * * *"
    options:
    - name: password_expiration_warning_days
      description: Non-negative warning window in days for password expiration (inclusive)
      required: true
      default: "30"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-python/lscpu_vulnerabilities.py
    schedule: "0 7 * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      tenant-server: {}
      infra-server: {}
      storage-server: {}

  - path: check-python/kolla_configuration_files_format.py
    schedule: "30 7 * * *"
    groups:
      tenant-server: {}
      control-server: {}
      infra-server: {}

  - path: check-python/nodes_statuses.py
    schedule: "*/15 * * * *"
    groups:
      kubernetes-cluster: {}

  - path: check-python/active_alerts_sync_status.py
    schedule: "*/5 * * * *"
    options:
    - name: whitemon_namespace
      description: Namespace to check for active alerts sync status in Whitemon
      required: true
      default: "whitemon"
    - name: whitemon_pod_prefix
      description: Prefix of pod to check for active alerts sync status in Whitemon
      required: true
      default: "whitemon-grafana"
    - name: whitemon_container
      description: Container to check for active alerts sync status in Whitemon
      required: true
      default: "grafana"
    - name: keep_noc_api_key
      description: Keep NOC API key for gathering active alerts in Whitemon
      required: true
      default: "keep-noc-api-key"
    groups:
      kubernetes-cluster: {}

  - path: check-python/chronyc_sources_status.py
    schedule: "*/5 * * * *"
    groups:
      provisioning-server: {}
      hybrid-provisioning-server: {}
      control-server: {}
      infra-server: {}
      tenant-server: {}
      storage-server: {}

  - path: check-python/virsh_threads_per_core.py
    schedule: "*/5 * * * *"
    options:
      - name: threads_per_core
        description: Threads per core lower threshold
        required: true
        default: "2"
    groups:
      tenant-server: {}

  - path: check-python/nova_config_trusted_vfs.py
    schedule: "30 7 * * *"
    options:
    - name: nova_config_path
      description: Nova Compute configuration file path
      required: true
      default: "/etc/whitecloud/.kolla/nova-compute/nova.conf"
    groups:
      tenant-server: {}
      infra-server: {}
