# Uptime/Rundeck check catalog: checks only.
# Operational defaults: rundeck/provisioning/config.yaml.
# Groups and NetBox: rundeck/provisioning/inventory.yaml (Ansible format).
#
# Each check: path = script relative to SCM_BASE_DIR (resolved at runtime).
# Stable id for tags/jobs/Uptime = basename without extension (stem).
# Optional one_host: true — assign check tag to a single eligible host (cluster CLI checks).
# Optional openstack: true — per-check job exports OS_* from config.yaml + OPENSTACK_PASSWORD option.

checks:
  - path: check-shell/apt_unattended_upgrades_disabled.sh
    schedule: "30 11 * * *"
    groups: [storage-server, provisioning-server]

  - path: check-shell/ufw.sh
    schedule: "*/15 * * * *"
    grace: 900
    groups: [provisioning-server]

  - path: check-shell/mdcheck_presence.sh
    schedule: "0 6 * * *"
    groups: [provisioning-server, control-server, infra-server, tenant-server, storage-server]

  - path: check-shell/mdcheck_deadlock_fix.sh
    schedule: "15 6 * * *"
    groups: [provisioning-server, control-server, infra-server, tenant-server, storage-server]

  - path: check-shell/server_needs_reboot.sh
    schedule: "30 6 * * *"
    groups: [control-server, infra-server, tenant-server, storage-server]

  - path: check-shell/grub_needs_reboot.sh
    schedule: "45 6 * * *"
    groups: [control-server, infra-server, tenant-server, storage-server]

  - path: check-shell/vrouter_ha_active_agent.sh
    schedule: "15 */6 * * *"
    groups: [control-server, infra-server]
    one_host: true
    openstack: true

  - path: check-shell/vrouter_port_bindings.sh
    schedule: "30 */6 * * *"
    groups: [control-server, infra-server]
    one_host: true
    openstack: true

  - path: check-shell/host_aggregates_consistency.sh
    schedule: "45 */6 * * *"
    groups: [control-server, infra-server]
    one_host: true
    openstack: true

  - path: check-shell/ceph_balancer_status.sh
    schedule: "0 */6 * * *"
    groups: [storage-server]
    one_host: true

  - path: check-shell/ceph_pool_autoscale.sh
    schedule: "10 */6 * * *"
    groups: [storage-server]
    one_host: true

  - path: check-shell/ceph_health_status.sh
    schedule: "20 */6 * * *"
    groups: [storage-server]
    one_host: true

  - path: check-shell/ceph_health_checks.sh
    schedule: "30 */6 * * *"
    groups: [storage-server]
    one_host: true

  - path: check-shell/ceph_osd_status.sh
    schedule: "40 */6 * * *"
    groups: [storage-server]
    one_host: true
  - path: check-python/lscpu_vulnerabilities.py
    schedule: "0 7 * * *"
    groups: [provisioning-server, control-server, tenant-server, infra-server, storage-server]

  - path: check-python/kolla_configuration_files_format.py
    schedule: "30 7 * * *"
    groups: [tenant-server, control-server, infra-server]

  - path: check-python/nodes_statuses.py
    schedule: "*/15 * * * *"
    groups: [kubernetes-cluster]
