powerprofile:
- name: expected_intel_profile_lower_range
  description: Expected Intel power profile lower range
  required: true
  default: "6"
- name: expected_intel_profile_upper_range
  description: Expected Intel power profile upper range
  required: true
  default: "7"
- name: expected_amd_profile_regex
  description: Expected AMD power profile regex
  required: true
  default: "^(PerfPerWattOptimized|PerfPerWattOptimizedDapc|PerfPerWattOptimizedOS)$"